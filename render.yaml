services:
  - type: web
    name: hiremitra
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@hiremitra.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin@HireMitra2025
      - key: ADMIN_DEFAULT_NAME
        value: HireMitra Administrator
